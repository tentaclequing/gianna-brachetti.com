<aside
  class="found-survey"
  id="found-survey"
  aria-label="How did you find this page?"
>
  <div class="found-prompt" id="found-prompt">
    <span class="found-label">🐙 Quick experiment</span>
    <p class="found-question">Aye, stranger, how did you land here?</p>
    <div class="found-options" role="group">
      <button class="found-btn" data-source="search" type="button">
        search engine
      </button>
      <button class="found-btn" data-source="ai" type="button">
        AI assistant
      </button>
      <button class="found-btn" data-source="social" type="button">
        social media
      </button>
      <button class="found-btn" data-source="shared" type="button">
        someone shared a link
      </button>
      <button class="found-btn" data-source="talk" type="button">
        conference / talk
      </button>
      <button class="found-btn" data-source="other" type="button">other</button>
    </div>
  </div>
  <div class="found-thanks" id="found-thanks" hidden>
    <span class="found-label">🐙</span>
    <p class="found-question" id="found-msg">
      Got it. Thanks for the data point.
    </p>
  </div>
</aside>
<script>
  (function () {
    var wrap = document.getElementById("found-survey");
    if (!wrap) return;
    var stored = false;
    try {
      stored = localStorage.getItem("found-answered");
    } catch (e) {}
    if (stored) {
      wrap.hidden = true;
      return;
    }

    var btns = wrap.querySelectorAll(".found-btn");
    var prompt = document.getElementById("found-prompt");
    var thanks = document.getElementById("found-thanks");

    var msg = document.getElementById("found-msg");

    btns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var source = btn.getAttribute("data-source");
        var sent = false;

        if (window.AhrefsAnalytics != null) {
          window.AhrefsAnalytics.sendEvent("found", {
            props: { source: source, page: location.pathname },
          });
          sent = true;
        }

        prompt.hidden = true;
        thanks.hidden = false;
        if (!sent) {
          msg.textContent =
            "Your browser blocked the tracking script, so this did not land. But thanks for trying.";
        }
        try {
          localStorage.setItem("found-answered", "1");
        } catch (e) {}
      });
    });
  })();
</script>
